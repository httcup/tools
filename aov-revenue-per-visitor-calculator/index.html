  <h1>客单价与访客收入计算器</h1>
  <p class="lede">按渠道输入访客数、转化率与客单价，计算各渠道收入、客单价与访客收入（RPV），并汇总加权总值。</p>
</header>

<main id="main" class="tool-main">
<section class="tool-card">
  <h2>输入</h2>
  <div class="row">
    <label class="field"><span>渠道 A 访客</span><input type="number" id="s1" value="6000" step="any" inputmode="decimal"></label>
    <label class="field"><span>渠道 A 转化率（%）</span><input type="number" id="c1" value="2.5" step="any" inputmode="decimal"></label>
    <label class="field"><span>渠道 A 客单（元）</span><input type="number" id="a1" value="200" step="any" inputmode="decimal"></label>
    <label class="field"><span>渠道 B 访客</span><input type="number" id="s2" value="3000" step="any" inputmode="decimal"></label>
    <label class="field"><span>渠道 B 转化率（%）</span><input type="number" id="c2" value="1.8" step="any" inputmode="decimal"></label>
    <label class="field"><span>渠道 B 客单（元）</span><input type="number" id="a2" value="150" step="any" inputmode="decimal"></label>
    <label class="field"><span>渠道 C 访客（0 跳过）</span><input type="number" id="s3" value="1000" step="any" inputmode="decimal"></label>
    <label class="field"><span>渠道 C 转化率（%）</span><input type="number" id="c3" value="2.0" step="any" inputmode="decimal"></label>
    <label class="field"><span>渠道 C 客单（元）</span><input type="number" id="a3" value="160" step="any" inputmode="decimal"></label>
  </div>
</section>
<section class="tool-card">
  <div class="card-head"><h2>结果</h2><span class="stats">输入即算，实时更新</span></div>
  <div id="out"></div>
  <p class="note">RPV = 收入 ÷ 访客，是同时反映转化与客单的综合指标，适合跨渠道比较。</p>
</section>
