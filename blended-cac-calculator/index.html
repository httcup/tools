  <h1>混合获客成本计算器</h1>
  <p class="lede">输入各渠道支出与新客数，计算混合 CAC 与分渠道 CAC，并检查首单贡献是否覆盖获客成本。</p>
</header>

<main id="main" class="tool-main">
<section class="tool-card">
  <h2>输入</h2>
  <div class="row">
    <label class="field"><span>渠道 A 支出（元）</span><input type="number" id="s1" value="6000" step="any" inputmode="decimal"></label>
    <label class="field"><span>渠道 A 新客</span><input type="number" id="n1" value="150" step="any" inputmode="decimal"></label>
    <label class="field"><span>渠道 B 支出（元）</span><input type="number" id="s2" value="4000" step="any" inputmode="decimal"></label>
    <label class="field"><span>渠道 B 新客</span><input type="number" id="n2" value="120" step="any" inputmode="decimal"></label>
    <label class="field"><span>渠道 C 支出（元，0 跳过）</span><input type="number" id="s3" value="0" step="any" inputmode="decimal"></label>
    <label class="field"><span>渠道 C 新客</span><input type="number" id="n3" value="0" step="any" inputmode="decimal"></label>
    <label class="field"><span>首单贡献利润（元）</span><input type="number" id="cm" value="40" step="any" inputmode="decimal"></label>
  </div>
</section>
<section class="tool-card">
  <div class="card-head"><h2>结果</h2><span class="stats">输入即算，实时更新</span></div>
  <div id="out"></div>
  <p class="note">首单贡献覆盖率超过 100% 说明首单就回本；不足时需要靠复购摊回 CAC。</p>
</section>
