  <h1>组合装与买一赠一利润计算器</h1>
  <p class="lede">选择组合装或买一赠一模式，输入单件售价与成本、组合价格、履约、支付与广告成本，核算每种促销形态扣除全部成本后的贡献利润。</p>
</header>

<main id="main" class="tool-main">
<section class="tool-card">
  <h2>输入</h2>
  <div class="row">
    <label class="field"><span>促销形态</span><select id="mode"><option value="bogo" selected>买一赠一（第二件 0 元）</option><option value="bundle">组合装（N 件一口价）</option></select></label>
    <label class="field"><span>单件售价（元）</span><input type="number" id="price" value="99" step="any" inputmode="decimal"></label>
    <label class="field"><span>单件商品成本（元）</span><input type="number" id="cost" value="30" step="any" inputmode="decimal"></label>
    <label class="field"><span>组合装件数</span><input type="number" id="n" value="3" step="any" inputmode="decimal"></label>
    <label class="field"><span>组合装一口价（元）</span><input type="number" id="bundlePrice" value="249" step="any" inputmode="decimal"></label>
    <label class="field"><span>履约与运费（元/单）</span><input type="number" id="ship" value="12" step="any" inputmode="decimal"></label>
    <label class="field"><span>支付费率（%）</span><input type="number" id="payRate" value="2.9" step="any" inputmode="decimal"></label>
    <label class="field"><span>单笔广告费（元）</span><input type="number" id="ad" value="30" step="any" inputmode="decimal"></label>
  </div>
</section>
<section class="tool-card">
  <div class="card-head"><h2>结果</h2><span class="stats">输入即算，实时更新</span></div>
  <div id="out"></div>
  <p class="note">买一赠一的真实成本是送出那一件的商品成本，而不是售价的一半。</p>
</section>
