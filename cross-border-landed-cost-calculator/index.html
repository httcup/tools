  <h1>跨境到岸总成本计算器</h1>
  <p class="lede">将工厂货价、头程运费、保险杂费、关税、可选进口增值税与本地履约费，按采购数量摊到每件商品，得到到岸单位成本。</p>
</header>

<main id="main" class="tool-main">
<section class="tool-card">
  <h2>输入</h2>
  <div class="row">
    <label class="field"><span>工厂单价（元）</span><input type="number" id="unit" value="30" step="any" inputmode="decimal"></label>
    <label class="field"><span>头程总运费（元）</span><input type="number" id="freight" value="800" step="any" inputmode="decimal"></label>
    <label class="field"><span>采购数量（件）</span><input type="number" id="qty" value="200" step="any" inputmode="decimal"></label>
    <label class="field"><span>保险与杂费（元）</span><input type="number" id="ins" value="100" step="any" inputmode="decimal"></label>
    <label class="field"><span>关税税率（%）</span><input type="number" id="dutyRate" value="8" step="any" inputmode="decimal"></label>
    <label class="field"><span>进口增值税（%）</span><input type="number" id="vatRate" value="0" step="any" inputmode="decimal"></label>
    <label class="field"><span>本地履约费（元/件）</span><input type="number" id="fulfill" value="12" step="any" inputmode="decimal"></label>
  </div>
</section>
<section class="tool-card">
  <div class="card-head"><h2>结果</h2><span class="stats">输入即算，实时更新</span></div>
  <div id="out"></div>
  <p class="note">到岸成本是定价、保本价与批发价的基准，建议随汇率与运价定期复核。</p>
</section>

<section class="facts" aria-label="处理方式">
  <article class="fact"><h2>全程本地</h2><p>所有计算都在这个页面里完成，过程不发起任何网络请求，输入的内容不会离开这台设备。</p></article>
  <article class="fact"><h2>不用注册</h2><p>没有账号、没有上传、没有水印。打开就用，关掉页面数据就没了，也不保存任何草稿。</p></article>
</section>
