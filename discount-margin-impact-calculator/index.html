  <h1>折扣利润影响计算器</h1>
  <p class="lede">输入原价、折扣力度、成本与费率，计算折后每单贡献利润，以及要维持原总利润需要增加多少订单。</p>
</header>

<main id="main" class="tool-main">
<section class="tool-card">
  <h2>输入</h2>
  <div class="row">
    <label class="field"><span>原价（元）</span><input type="number" id="price" value="199" step="any" inputmode="decimal"></label>
    <label class="field"><span>折扣（%）</span><input type="number" id="discount" value="20" step="any" inputmode="decimal"></label>
    <label class="field"><span>商品与履约成本（元）</span><input type="number" id="cost" value="80" step="any" inputmode="decimal"></label>
    <label class="field"><span>支付与平台费率（%）</span><input type="number" id="feeRate" value="3.5" step="any" inputmode="decimal"></label>
    <label class="field"><span>当前月订单量</span><input type="number" id="orders" value="1000" step="any" inputmode="decimal"></label>
  </div>
</section>
<section class="tool-card">
  <div class="card-head"><h2>结果</h2><span class="stats">输入即算，实时更新</span></div>
  <div id="out"></div>
  <p class="note">折扣 20% 时若毛利率只有 25%，订单量要翻数倍才能补回利润，慎打深折。</p>
</section>
