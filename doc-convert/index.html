<header class="hub-head">

    <p class="brand"><a class="brand-home" href="../"><svg class="site-logo" viewBox="0 0 64 64" aria-hidden="true" focusable="false">

  <nav class="crumbs" aria-label="位置">
    <a href="../">全部工具</a><span aria-hidden="true">›</span><span aria-current="page">文档格式互转</span>
  </nav>
  <h1>文档格式互转</h1>
  <p class="lede">Word、PPT、Excel、CSV、TXT、HTML、Markdown 之间挑着转。读得懂内容，写得出文件，中间不经过任何服务器。</p>
</header>

<main id="main" class="tool-main">

<section class="tool-card">
  <label class="drop" id="drop" for="file">
    <strong>选一个文件，或者拖到这里</strong>
    <span>支持 .docx .pptx .xlsx .csv .tsv .txt .md .html</span>
    <input id="file" type="file" accept=".docx,.pptx,.xlsx,.csv,.tsv,.txt,.md,.markdown,.html,.htm" hidden>
  </label>
  <p class="status" id="status" role="status"></p>
</section>

<section class="tool-card" id="opts" hidden>
  <div class="row">
    <label class="field"><span>转成</span>
      <select id="target">
        <option value="html">网页 .html</option>
        <option value="docx">Word .docx</option>
        <option value="md">Markdown .md</option>
        <option value="txt">纯文本 .txt</option>
        <option value="xlsx">Excel .xlsx</option>
        <option value="csv">CSV .csv</option>
        <option value="tsv">TSV .tsv</option>
      </select>
    </label>
    <label class="field"><span>CSV 分隔符</span>
      <select id="delim">
        <option value="," selected>逗号 ,</option>
        <option value=";">分号 ;</option>
        <option value="\t">制表符 Tab</option>
      </select>
    </label>
    <label class="check check-mid"><input type="checkbox" id="headrow" checked> 第一行当表头</label>
  </div>
  <div class="row">
    <button class="btn btn-primary" type="button" id="go">开始转换</button>
    <button class="btn" type="button" id="reset">换一个文件</button>
  </div>
  <p class="meta" id="meta"></p>
</section>

<section class="tool-card" id="out" hidden>
  <div class="card-head"><h2>结果</h2><span class="hint" id="sum"></span></div>
  <div class="row"><a class="btn btn-primary" id="dl" href="#" download>下载</a></div>
  <label class="field" style="margin-top:0.9rem"><span>预览（前 4000 字）</span>
    <textarea class="out" id="preview" readonly></textarea>
  </label>
</section>

<section class="facts" aria-label="处理方式">
  <article class="fact"><h2>全程本地</h2><p>所有计算都在这个页面里完成，过程不发起任何网络请求，输入的内容不会离开这台设备。</p></article>
  <article class="fact"><h2>不用注册</h2><p>没有账号、没有上传、没有水印。打开就用，关掉页面数据就没了，也不保存任何草稿。</p></article>
</section>
</main>

<footer>

</footer>
