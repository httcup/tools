  <h1>证件照换底色</h1>
  <p class="lede">上传一张照片，它先把人像抠出来，再铺上你要的底色。白底、蓝底、红底、任意颜色都行，也可以只导出人像、背景留透明。</p>

<main id="main" class="tool-main">

<section class="tool-card">
  <label class="drop" id="drop" for="file">
    <strong>选一张照片，或者拖到这里</strong>
    <span>正面、头肩居中的效果最好；文件不上传</span>
    <input id="file" type="file" accept="image/*" hidden>
  </label>
  <p class="status" id="status" role="status"></p>
</section>

<section class="tool-card" id="opts" hidden>
  <div class="card-head"><h2>要什么底色</h2><span class="hint" id="engine"></span></div>
  <div class="swatches" id="swatches" role="group" aria-label="常见底色">
    <button class="swatch" type="button" data-color="#ffffff" style="background:#ffffff" aria-pressed="true" aria-label="白底" title="白底"></button>
    <button class="swatch" type="button" data-color="#438edb" style="background:#438edb" aria-pressed="false" aria-label="蓝底" title="蓝底"></button>
    <button class="swatch" type="button" data-color="#d9001b" style="background:#d9001b" aria-pressed="false" aria-label="红底" title="红底"></button>
    <button class="swatch" type="button" data-color="#f0f0f0" style="background:#f0f0f0" aria-pressed="false" aria-label="浅灰底" title="浅灰底"></button>
    <label class="swatch swatch-custom" id="customWrap" title="自定义颜色" aria-pressed="false">
      <input id="color" type="color" value="#438edb" aria-label="自定义颜色">
    </label>
  </div>
  <div class="row">
    <label class="field"><span>边缘收紧</span>
      <div class="range-row">
        <input id="edge" type="range" min="0" max="60" value="25" step="2">
        <output id="edgeOut" for="edge">25%</output>
      </div>
    </label>
  </div>
  <div class="checks">
    <label class="check"><input id="transparent" type="checkbox"> 背景留透明（导出 PNG）</label>
    <label class="check"><input id="clean" type="checkbox" checked> 边缘去旧底色残留</label>
  </div>
  <div class="row">
    <button class="btn" type="button" id="again">换一张照片</button>
  </div>
  <p class="meta" id="meta"></p>
</section>

<section class="tool-card" id="out" hidden>
  <div class="card-head"><h2>效果</h2><span class="hint" id="sum"></span></div>
  <div class="pair">
    <figure><figcaption>原图</figcaption><canvas id="before"></canvas></figure>
    <figure><figcaption>换好之后</figcaption><canvas id="after" class="checker"></canvas></figure>
  </div>
  <div class="row">
    <a class="btn btn-primary" id="png" href="#" download>下载 PNG</a>
    <a class="btn" id="jpg" href="#" download>下载 JPG</a>
  </div>
</section>
