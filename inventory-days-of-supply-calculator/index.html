  <h1>库存覆盖天数计算器</h1>
  <p class="lede">扣除已承诺库存与安全库存后，计算单个 SKU 的净可用天数、预计缺货时间，以及补齐提前期所需采购量。</p>

<main id="main" class="tool-main">
<section class="tool-card">
  <h2>输入</h2>
  <div class="row">
    <label class="field"><span>当前库存（件）</span><input type="number" id="stock" value="300" step="any" inputmode="decimal"></label>
    <label class="field"><span>已承诺/未发货（件）</span><input type="number" id="committed" value="40" step="any" inputmode="decimal"></label>
    <label class="field"><span>安全库存（件）</span><input type="number" id="safety" value="60" step="any" inputmode="decimal"></label>
    <label class="field"><span>日均销量（件）</span><input type="number" id="daily" value="12" step="any" inputmode="decimal"></label>
    <label class="field"><span>提前期（天）</span><input type="number" id="leadTime" value="7" step="any" inputmode="decimal"></label>
  </div>
</section>
<section class="tool-card">
  <div class="card-head"><h2>结果</h2><span class="stats">输入即算，实时更新</span></div>
  <div id="out"></div>
  <p class="note">净覆盖天数扣除了安全库存，跌破 0 意味着已侵入安全水位，应立即下单。</p>
