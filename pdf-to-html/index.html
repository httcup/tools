  <h1>PDF 转 HTML</h1>
  <p class="lede">导出一个自带样式的网页文件：文字能选、能搜、能在手机上重排；要跟原版面一模一样也可以。</p>
</header>

<main id="main" class="tool-main">

<section class="tool-card">
  <label class="drop" id="drop" for="file">
    <strong>选一个 PDF，或者把文件拖到这里</strong>
    <span>文件只在这个页面里打开，不会上传</span>
    <input id="file" type="file" accept="application/pdf,.pdf" hidden>
  </label>
  <p class="status" id="status" role="status"></p>
</section>

<section class="tool-card" id="opts" hidden>
  <div class="row">
    <label class="field"><span>版式</span>
      <select id="mode">
        <option value="flow" selected>语义化正文（手机能重排）</option>
        <option value="layout">还原版面（按原位置摆放）</option>
        <option value="image">每页一张图（最保真）</option>
      </select>
    </label>
    <label class="field"><span>页码</span>
      <input id="pages" type="text" placeholder="全部，或 1-3,7,9-" value="">
    </label>
    <label class="check check-mid"><input type="checkbox" id="breakpage" checked> 每页之间画一条分隔线</label>
  </div>
  <div class="row">
    <button class="btn btn-primary" type="button" id="go">转换成 HTML</button>
    <button class="btn" type="button" id="open" hidden>在新标签页预览</button>
    <button class="btn" type="button" id="reset">换一个文件</button>
  </div>
  <p class="meta" id="meta"></p>
</section>

<section class="tool-card" id="out" hidden>
  <div class="card-head"><h2>结果</h2><span class="hint" id="sum"></span></div>
  <div class="row"><a class="btn btn-primary" id="dl" href="#" download>下载 .html</a></div>
  <label class="field" style="margin-top:0.9rem"><span>HTML 源码（前 6000 字）</span>
    <textarea class="out" id="preview" readonly></textarea>
  </label>
</section>

<section class="facts" aria-label="处理方式">
  <article class="fact"><h2>全程本地</h2><p>所有计算都在这个页面里完成，过程不发起任何网络请求，输入的内容不会离开这台设备。</p></article>
  <article class="fact"><h2>不用注册</h2><p>没有账号、没有上传、没有水印。打开就用，关掉页面数据就没了，也不保存任何草稿。</p></article>
</section>
</main>

<footer>
