<style>
.drop { display: grid; place-items: center; gap: 0.35rem; padding: 1.8rem 1rem; border: 1.5px dashed var(--border); border-radius: 10px; background: var(--surface-2); text-align: center; cursor: pointer; transition: border-color 0.15s, background 0.15s; }
.drop:hover, .drop.hot { border-color: var(--accent); background: var(--surface); }
.drop strong { font-size: 0.98rem; font-weight: 600; }
.drop span { font-size: 0.8rem; color: var(--text-dim); }
.hint { margin: 0.1rem 0 0; font-size: 0.78rem; color: var(--text-dim); }
.status { margin: 0.7rem 0 0; font-size: 0.82rem; color: var(--text-dim); min-height: 1.2em; }
.shots { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 0.6rem; margin-top: 0.4rem; }
.shot { margin: 0; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: #fff; }
.shot img { display: block; width: 100%; height: auto; }
.shot figcaption { padding: 0.25rem 0.4rem; font-size: 0.72rem; color: var(--text-dim); text-align: center; background: var(--surface-2); }
.meta { display: flex; flex-wrap: wrap; gap: 0.3rem 1.1rem; margin: 0.5rem 0 0; font-size: 0.79rem; color: var(--text-dim); }

<header class="hub-head">
  <div class="head-row">
    <p class="brand"><a class="brand-home" href="../"><svg class="site-logo" viewBox="0 0 64 64" aria-hidden="true" focusable="false">

</svg>Tools</a></p>
  </div>
  <nav class="crumbs" aria-label="位置">
    <a href="../">全部工具</a><span aria-hidden="true">›</span><span aria-current="page">PDF 转图片</span>
  </nav>
  <h1>PDF 转图片</h1>
  <p class="lede">把每一页渲染成 PNG 或 JPG，按你需要选清晰度、挑页码，多页可以打包下载，也能拼成一张竖着看的长图。</p>
</header>

<main id="main" class="tool-main">

<section class="tool-card">
  <label class="drop" id="drop" for="file">
    <strong>选一个 PDF，或者把文件拖到这里</strong>
    <span>文件只在这个页面里打开，不会上传</span>
    <input id="file" type="file" accept="application/pdf,.pdf" hidden>
  </label>
  <p class="status" id="status" role="status"></p>
</section>

<section class="tool-card" id="opts" hidden>
  <div class="row">
    <label class="field"><span>输出格式</span>
      <select id="fmt">
        <option value="png">PNG（无损，线条清楚）</option>
        <option value="jpeg">JPG（体积小，适合照片页）</option>
      </select>
    </label>
    <label class="field"><span>清晰度</span>
      <select id="dpi">
        <option value="96">96 DPI · 屏幕看</option>
        <option value="150" selected>150 DPI · 一般够用</option>
        <option value="220">220 DPI · 要打印</option>
        <option value="300">300 DPI · 印刷级</option>
      </select>
    </label>
    <label class="field"><span>页码</span>
      <input id="pages" type="text" placeholder="全部，或 1-3,7,9-" value="">
    </label>
    <label class="field"><span>拼接方式</span>
      <select id="mode">
        <option value="each" selected>每页一张图</option>
        <option value="long">全部拼成一张长图</option>
      </select>
    </label>
  </div>
  <div class="row">
    <button class="btn btn-primary" type="button" id="go">开始转换</button>
    <button class="btn" type="button" id="reset">换一个文件</button>
  </div>
  <p class="meta" id="meta"></p>
</section>

<section class="tool-card" id="out" hidden>
  <div class="card-head"><h2>结果</h2><span class="hint" id="sum"></span></div>
  <div class="shots" id="shots"></div>
  <div class="row">
    <a class="btn btn-primary" id="dl" href="#" download>下载</a>
  </div>
</section>

<section class="facts" aria-label="处理方式">
  <article class="fact"><h2>全程本地</h2><p>所有计算都在这个页面里完成，过程不发起任何网络请求，输入的内容不会离开这台设备。</p></article>
  <article class="fact"><h2>不用注册</h2><p>没有账号、没有上传、没有水印。打开就用，关掉页面数据就没了，也不保存任何草稿。</p></article>
</section>
</main>

<footer>

</footer>
