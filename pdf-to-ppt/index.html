  <h1>PDF 转 PPT</h1>
  <p class="lede">每一页当成一页幻灯片，文字装进能直接改的文本框；也可以把整页铺成图片，当背景用。</p>
</header>

<main id="main" class="tool-main">

<section class="tool-card">
  <label class="drop" id="drop" for="file">
    <strong>选一个 PDF，或者把文件拖到这里</strong>
    <span>文件只在这个页面里打开，不会上传</span>
    <input id="file" type="file" accept="application/pdf,.pdf" hidden>
  </label>
  <p class="status" id="status" role="status"></p>
</section>

<section class="tool-card" id="opts" hidden>
  <div class="row">
    <label class="field"><span>版式</span>
      <select id="mode">
        <option value="text" selected>文字可编辑（标题 + 正文）</option>
        <option value="image">整页截图（原样还原）</option>
      </select>
    </label>
    <label class="field"><span>正文字号</span>
      <select id="size">
        <option value="14">14 pt</option>
        <option value="16" selected>16 pt</option>
        <option value="18">18 pt</option>
        <option value="20">20 pt</option>
      </select>
    </label>
    <label class="field"><span>页码</span>
      <input id="pages" type="text" placeholder="全部，或 1-3,7,9-" value="">
    </label>
  </div>
  <div class="row">
    <button class="btn btn-primary" type="button" id="go">转换成 PPT</button>
    <button class="btn" type="button" id="reset">换一个文件</button>
  </div>
  <p class="meta" id="meta"></p>
</section>

<section class="tool-card" id="out" hidden>
  <div class="card-head"><h2>结果</h2><span class="hint" id="sum"></span></div>
  <div class="row"><a class="btn btn-primary" id="dl" href="#" download>下载 .pptx</a></div>
  <div class="slides" id="slides"></div>
</section>

<section class="facts" aria-label="处理方式">
  <article class="fact"><h2>全程本地</h2><p>所有计算都在这个页面里完成，过程不发起任何网络请求，输入的内容不会离开这台设备。</p></article>
  <article class="fact"><h2>不用注册</h2><p>没有账号、没有上传、没有水印。打开就用，关掉页面数据就没了，也不保存任何草稿。</p></article>
</section>
</main>
