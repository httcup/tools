  <h1>百分比计算器</h1>
  <p class="lede">「X 的 15% 是多少」「X 占 Y 的百分之几」「从 X 涨到 Y 涨了多少」——三种最常见的百分比问法，各占一格，填数即出结果。</p>
</header>

<main id="main" class="tool-main">
<section class="tool-card">
  <h2>X 的 Y% 是多少</h2>
  <div class="row">
    <input type="number" id="a1" step="any" placeholder="X">
    <span class="mid">的</span>
    <input type="number" id="a2" step="any" placeholder="Y">
    <span class="mid">%</span>
    <strong class="out-inline" id="ra">—</strong>
  </div>
</section>
<section class="tool-card">
  <h2>X 是 Y 的百分之几</h2>
  <div class="row">
    <input type="number" id="b1" step="any" placeholder="X">
    <span class="mid">/</span>
    <input type="number" id="b2" step="any" placeholder="Y">
    <strong class="out-inline" id="rb">—</strong>
  </div>
</section>
<section class="tool-card">
  <h2>从 X 到 Y 变化了多少</h2>
  <div class="row">
    <input type="number" id="c1" step="any" placeholder="X（原值）">
    <span class="mid">→</span>
    <input type="number" id="c2" step="any" placeholder="Y（新值）">
    <strong class="out-inline" id="rc">—</strong>
  </div>
</section>
<section class="facts" aria-label="处理方式">
  <article class="fact"><h2>全程本地</h2><p>所有计算都在这个页面里完成，过程不发起任何网络请求，输入的内容不会离开这台设备。</p></article>

</section>
