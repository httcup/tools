  <h1>退款损失计算器</h1>
  <p class="lede">核算一笔退款中支付手续费损失、已付运费、重新上架人工与商品成本回收情况，得到净现金损失。</p>
</header>

<main id="main" class="tool-main">
<section class="tool-card">
  <h2>输入</h2>
  <div class="row">
    <label class="field"><span>退款金额（元）</span><input type="number" id="refund" value="199" step="any" inputmode="decimal"></label>
    <label class="field"><span>支付费率（%）</span><input type="number" id="payRate" value="2.9" step="any" inputmode="decimal"></label>
    <label class="field"><span>支付单笔固定费（元）</span><input type="number" id="payFixed" value="0.3" step="any" inputmode="decimal"></label>
    <label class="field"><span>已产生运费（元）</span><input type="number" id="shipPaid" value="10" step="any" inputmode="decimal"></label>
    <label class="field"><span>重新上架人工（元）</span><input type="number" id="restock" value="5" step="any" inputmode="decimal"></label>
    <label class="field"><span>商品成本（元）</span><input type="number" id="cogs" value="60" step="any" inputmode="decimal"></label>
    <label class="field"><span>商品回收情况</span><select id="recover"><option value="yes" selected>可再售（回收商品价值）</option><option value="no">不可再售（货损）</option></select></label>
  </div>
</section>
<section class="tool-card">
  <div class="card-head"><h2>结果</h2><span class="stats">输入即算，实时更新</span></div>
  <div id="out"></div>
  <p class="note">多数网关退款不退手续费，这笔「看不见的钱」在退款量大时非常可观。</p>
</section>
