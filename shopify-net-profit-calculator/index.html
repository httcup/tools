  <h1>店铺净利润计算器</h1>
  <p class="lede">按月销售额核算商品成本、履约、支付与平台费、广告、退款与税费后的净利润，并给出净利润率。</p>
</header>

<main id="main" class="tool-main">
<section class="tool-card">
  <h2>输入</h2>
  <div class="row">
    <label class="field"><span>月销售额（元）</span><input type="number" id="revenue" value="50000" step="any" inputmode="decimal"></label>
    <label class="field"><span>商品成本率（%）</span><input type="number" id="cogsRate" value="45" step="any" inputmode="decimal"></label>
    <label class="field"><span>履约运费率（%）</span><input type="number" id="shipRate" value="12" step="any" inputmode="decimal"></label>
    <label class="field"><span>支付与交易费率（%）</span><input type="number" id="payRate" value="3.2" step="any" inputmode="decimal"></label>
    <label class="field"><span>平台月租与固定费（元）</span><input type="number" id="platformFee" value="320" step="any" inputmode="decimal"></label>
    <label class="field"><span>广告支出（元）</span><input type="number" id="ad" value="8000" step="any" inputmode="decimal"></label>
    <label class="field"><span>退款率（%）</span><input type="number" id="refundRate" value="5" step="any" inputmode="decimal"></label>
    <label class="field"><span>综合税率（%）</span><input type="number" id="taxRate" value="0" step="any" inputmode="decimal"></label>
  </div>
</section>
<section class="tool-card">
  <div class="card-head"><h2>结果</h2><span class="stats">输入即算，实时更新</span></div>
  <div id="out"></div>
  <p class="note">各费率建议取对账单实付口径，而不是支付渠道标称费率。</p>
</section>

<section class="facts" aria-label="处理方式">
  <article class="fact"><h2>全程本地</h2><p>所有计算都在这个页面里完成，过程不发起任何网络请求，输入的内容不会离开这台设备。</p></article>
