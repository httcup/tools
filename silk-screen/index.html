  <h1>丝网印刷滤镜</h1>
  <p class="lede">把照片转成三通道半调网点效果，可调网点尺寸、角度与三种通道颜色，输出印刷风格设计图。</p>

<section class="tool-card">
  <div class="drop" id="drop">
    <p><b>拖入图片</b> 或</p>
    <label class="btn btn-primary">选择图片<input type="file" id="file" accept="image/*" hidden></label>
  </div>
</section>

<section class="tool-card">
  <div class="card-head"><h2>半调预览</h2><span class="stats" id="stats"></span></div>
  <div style="text-align:center"><canvas id="cv" style="max-width:100%;border:1px solid var(--border);border-radius:8px;background:repeating-conic-gradient(#eee 0 25%,#fff 0 50%) 0 0/16px 16px"></canvas></div>
  <div class="row"><label class="field"><span>网点间距</span><input type="range" id="dot" min="4" max="24" value="8"></label><label class="field"><span>C 色</span><input type="color" id="cC" value="#1a6db3"></label><label class="field"><span>M 色</span><input type="color" id="cM" value="#d04a5e"></label><label class="field"><span>Y 色</span><input type="color" id="cY" value="#e9b53a"></label><a class="btn btn-primary" id="dl" download="output.png" hidden>下载 PNG</a></div>
</section>
